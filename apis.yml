aid: qomplement
name: Qomplement
description: >-
  Qomplement is a San Francisco-based Y Combinator (Spring 2026) company building
  an AI-native platform for supply chain and document-heavy back-office operations.
  Its publicly documented developer product is the Qomplement StructDatafy API, a
  REST API that extracts structured data from documents in 30+ formats, fills PDF
  forms, and populates Excel templates programmatically using AI OCR and structuring
  models. The API is asynchronous (job-based), authenticated with Bearer API keys
  issued from the developer portal, rate limited per minute and per month, and ships
  first-party Python and Node.js SDKs. This profile captures the published API surface,
  SDKs, authentication, conventions, error model, webhooks, and lifecycle.
